{
  "name": "publish",
  "on": {
    "release": {
      "types": [
        "published"
      ]
    }
  },
  "permissions": {},
  "concurrency": {
    "group": "pypi-${{ github.event.release.tag_name }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read"
      },
      "steps": [
        {
          "name": "Check out the exact release tag",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "ref": "${{ github.event.release.tag_name }}",
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.12",
            "cache": "pip",
            "cache-dependency-path": "requirements/build.txt"
          }
        },
        {
          "name": "Match tag to package version",
          "run": "python -c \"import os,sys,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; tag=os.environ['GITHUB_REF_NAME']; expected='v'+version; sys.exit(0 if tag == expected else f'{tag} does not match {expected}')\""
        },
        {
          "name": "Install the hash-pinned build backend",
          "run": "python -m pip install --require-hashes -r requirements/build.txt"
        },
        {
          "name": "Build wheel and source distribution",
          "run": "python -c \"from setuptools.build_meta import build_sdist,build_wheel; build_sdist('dist'); build_wheel('dist')\""
        },
        {
          "name": "Test the built wheel",
          "run": "python -m pip install --force-reinstall --no-deps dist/*.whl && python -m unittest discover -s tests -v"
        },
        {
          "name": "Record distribution hashes",
          "run": "sha256sum dist/*"
        },
        {
          "name": "Transfer distributions to the isolated publisher",
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "with": {
            "name": "python-package-distributions",
            "path": "dist/",
            "if-no-files-found": "error",
            "retention-days": 1,
            "compression-level": 0
          }
        }
      ]
    },
    "publish": {
      "needs": "build",
      "if": "${{ vars.PYPI_PUBLISH_RELEASE == github.event.release.tag_name }}",
      "runs-on": "ubuntu-latest",
      "environment": {
        "name": "pypi",
        "url": "https://pypi.org/p/hypothesisctl"
      },
      "permissions": {
        "id-token": "write"
      },
      "steps": [
        {
          "name": "Download distributions only",
          "uses": "actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c",
          "with": {
            "name": "python-package-distributions",
            "path": "dist/"
          }
        },
        {
          "name": "Publish with a short-lived PyPI identity",
          "uses": "pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33",
          "with": {
            "packages-dir": "dist/",
            "verify-metadata": true,
            "attestations": true,
            "verbose": false,
            "print-hash": true
          }
        }
      ]
    }
  }
}
